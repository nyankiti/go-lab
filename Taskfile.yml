version: '3'

tasks:
  # === 開発環境セットアップタスク ===
  setup:
    desc: "プロジェクトに必要なGoツールとNode.js依存関係をすべてインストールします"
    cmds:
      - task: install-go-tools
      - pnpm install --frozen-lockfile

  install-go-tools:
    desc: "Goに必要なツール (go-task, golangci-lint) をインストールします"
    cmds:
      # Taskのインストール (すでにTaskfileを実行しているのでTask自体は実行中ですが、再インストールが必要な場合)
      # - go install github.com/go-task/task/v3/cmd/task@latest 
      # golangci-lint のインストール
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      # その他のツールもここに追加 (例: プロトコルバッファ用の Buf CLI)
      # - go install github.com/bufbuild/buf/cmd/buf@latest

  # === アプリケーションタスク ===
  dev:
    desc: "全てを開発モードで起動"
    cmds:
      - pnpm run dev

  build:
    desc: "全てをビルド"
    cmds:
      - pnpm run build

  lint:
    desc: "全てをlint"
    cmds:
      - pnpm run lint